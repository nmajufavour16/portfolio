<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Message from Phayvo</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            background-color: #0f0f0f;
            padding: 20px;
            border-radius: 8px;
        }
        .header h1 {
            color: #32cd32;
            font-size: 24px;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .card {
            padding: 10px 0;
        }
        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
            opacity: 0.6;
        }
        .value {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 24px;
        }
        .value a {
            color: #32cd32;
            text-decoration: none;
        }
        .message-box {
            font-size: 15px;
            white-space: pre-wrap;
            padding-left: 16px;
            border-left: 4px solid #32cd32;
            margin-top: 10px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            background-color: #0f0f0f;
            color: #6b6b70;
            padding: 20px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Phayvo.</h1>
        </div>
        
        <div class="card">
            <span class="label">From</span>
            <p class="value">{{ name }} (<a href="mailto:{{ email }}">{{ email }}</a>)</p>

            <span class="label">Subject</span>
            <p class="value" style="color: #32cd32; font-weight: 600;">{{ subject }}</p>

            <span class="label">Message</span>
            <div class="message-box">{{ message }}</div>
        </div>

        <div class="footer">
            <p>This message was sent from the contact form on your portfolio website.</p>
        </div>
    </div>
</body>
</html>

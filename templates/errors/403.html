{% extends 'base.html' %}

{% block title %}403 — Access Denied{% endblock %}
{% block meta_description %}Access to this resource is restricted.{% endblock %}

{% block content %}
<section class="error-page" data-reveal>
    <div class="hero__cursor-orb" aria-hidden="true" style="opacity: 0.35;"></div>
    
    <h1 class="error-page__code">403</h1>
    <h2 class="error-page__title">Restricted territory.</h2>
    <p class="error-page__desc">You don't have permission to access this secure area.</p>
    
    <div class="error-page__actions">
        <a href="{% url 'home' %}" class="btn btn--primary">Return Home</a>
    </div>
</section>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #f5f5f4;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 0%, #b8b8bc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-title {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            color: #a1a1aa;
            max-width: 400px;
            margin: 0 auto 2.5rem;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 1.75rem;
            background-color: #32cd32;
            color: #0b2f0b;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #4ced4c;
        }
    </style>
</head>
<body>
    <h1 class="error-code">500</h1>
    <h2 class="error-title">System hiccup.</h2>
    <p class="error-desc">Our servers are currently experiencing some turbulence. Please try again in a few moments.</p>
    
    <a href="/" class="btn">Return Home</a>
</body>
</html>

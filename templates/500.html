{% extends 'base.html' %}

{% block title %}500 — Server Error{% endblock %}

{% block content %}
<section class="error-page" style="min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative;">
    <div class="hero__cursor-orb" aria-hidden="true" style="opacity: 0.5;"></div>
    
    <h1 style="font-size: clamp(6rem, 15vw, 12rem); font-weight: 800; line-height: 1; margin: 0; background: linear-gradient(180deg, #ffffff 0%, #b8b8bc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</h1>
    <h2 style="font-size: clamp(1.5rem, 3vw, 2.5rem); margin-top: 1rem; margin-bottom: 0.5rem;">System hiccup.</h2>
    <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto 2.5rem; font-size: 1.1rem;">Our servers are currently experiencing some turbulence. Please try again in a few moments.</p>
    
    <a href="{% url 'home' %}" class="btn btn--primary">Return Home</a>
</section>
{% endblock %}

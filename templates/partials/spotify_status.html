{% if spotify %}
<a class="listening-strip" href="{{ spotify.spotify_url|default:'https://open.spotify.com/' }}"
   target="_blank" rel="noopener" aria-label="Open {{ spotify.title }} on Spotify">
    {% if spotify.image_url %}<img src="{{ spotify.image_url }}" alt="" class="listening-strip__cover">{% endif %}
    <span class="listening-strip__copy">
        <span class="listening-strip__state">
            <span class="listening-strip__signal {% if spotify.is_playing %}is-playing{% endif %}" aria-hidden="true"><i></i><i></i><i></i></span>
            {% if spotify.is_playing %}Currently listening{% else %}Last listened{% endif %}
        </span>
        <strong>{{ spotify.title }}</strong>
        <span>{{ spotify.artist }}</span>
    </span>
    <span class="listening-strip__source">Spotify ↗</span>
</a>
{% else %}
<p class="section-subtitle">Spotify listening data is unavailable right now.</p>
{% endif %}

{% for project in projects %}
<article class="project-card project-card--dev">
    <a href="{% url 'project_detail' project.slug %}" class="project-card__link">
        <div class="project-card__thumb">
            <img src="{{ project.thumbnail.url }}" alt="{{ project.title }}" loading="lazy">
        </div>
        <div class="project-card__body">
            <h2 class="project-card__title">{{ project.title }}</h2>
            <p class="project-card__desc">{{ project.description }}</p>
            <ul class="tech-pills">
                {% for skill in project.skills_used.all %}
                <li class="tech-pill">{{ skill.name }}</li>
                {% endfor %}
            </ul>
        </div>
    </a>
</article>
{% empty %}
<p class="project-grid__empty">No projects match that filter yet.</p>
{% endfor %}
